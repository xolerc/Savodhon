name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Sync web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Savodhon-v3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Savodhon-APK
          path: apk/Savodhon-v3.0.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Savodhon ${{ github.ref_name }}" \
            --notes-file /dev/stdin \
            --latest \
            apk/Savodhon-v3.0.apk <<'NOTES'
          Savodhon — So'z Ustasi v3.0 (2026 alifbo)

          ## Yangilanishlar
          - 2026 alifbo: 28 harf (Ö Ğ Ş Ç), 1008 so'z
          - Vizual lug'at (emoji) + bo'g'in chiplari
          - Eshit-takrorla (logoped, mikrofon) + artikulatsiya yo'riqnomasi
          - SM-2 takrorlash + aqlli navbat + haftalik hisobot
          - Har so'zda kulrang inglizcha tarjima
          - Eski/yangi imlo tengligi + Savodhon loader
          NOTES
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
