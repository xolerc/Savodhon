name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip
          SDK_ROOT=$HOME/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools
          cd /tmp
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $SDK_ROOT/cmdline-tools
          mkdir -p $SDK_ROOT/cmdline-tools/latest
          mv $SDK_ROOT/cmdline-tools/cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/
          export PATH=$SDK_ROOT/cmdline-tools/latest/bin:$PATH
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Sync web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Savodhon-v3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Savodhon-APK
          path: apk/Savodhon-v3.0.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v3')
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Savodhon ${{ github.ref_name }}" \
            --notes-file /dev/stdin \
            --latest \
            apk/Savodhon-v3.0.apk <<'NOTES'
          Savodhon — So'z Ustasi v3.0 (2026 alifbo)

          ## Yangilanishlar
          - 2026 alifbo: 28 harf (Ö Ğ Ş Ç), 1008 so'z
          - Vizual lug'at (emoji) + bo'g'in chiplari
          - Eshit-takrorla (logoped, mikrofon) + artikulatsiya yo'riqnomasi
          - SM-2 takrorlash + aqlli navbat + haftalik hisobot
          - Har so'zda kulrang inglizcha tarjima
          - Eski/yangi imlo tengligi + Savodhon loader
          NOTES
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
